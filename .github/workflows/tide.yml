# 매일 새벽 4시 30분(한국 시간)에 물때를 받아 data/tide.json을 갱신하고,
# 블로그 최근 글·낚시 노트 목록·사이트 지도(tools/build.py)도 정리한다.
# 저장소 Settings → Secrets and variables → Actions 에 KHOA_SERVICE_KEY(공공데이터포털 인증키)를 넣어 두면 된다.
# Actions 탭에서 'Run workflow'를 눌러 바로 돌려 볼 수도 있다.
name: 물때 갱신

on:
  schedule:
    - cron: "30 19 * * *"   # UTC 19:30 = KST 04:30
    # 블로그 예약 발행(수 21:00, 일 09:00) 30분 뒤 최근 글 반영
    - cron: "30 12 * * 3"   # UTC 수 12:30 = KST 수 21:30
    - cron: "30 0 * * 0"    # UTC 일 00:30 = KST 일 09:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tide
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 물때 받기
        env:
          KHOA_SERVICE_KEY: ${{ secrets.KHOA_SERVICE_KEY }}
        run: python tools/fetch_tide.py
      - name: 블로그 최근 글·노트 목록·사이트 지도 정리
        if: success() || failure()   # 물때가 실패해도 블로그 글 정리는 한다
        run: python tools/build.py
      - name: 바뀐 게 있으면 저장
        if: success() || failure()
        run: |
          git config user.name "tide-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html notes.html sitemap.xml robots.txt '*.html'
          git diff --cached --quiet || git commit -m "물때·블로그 글 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
