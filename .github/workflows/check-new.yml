# 임시 확인용(공개 전에 지움): taean-anmyeon 브랜치에 올리면 새 관측소·격자를 한 번 불러 보고 결과를 그 브랜치에 저장한다.
name: 새 관측소 확인
on:
  push:
    branches: [taean-anmyeon]
    paths: [".github/workflows/check-new.yml", "tools/_check_new.py"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 불러 보기
        env:
          KHOA_SERVICE_KEY: ${{ secrets.KHOA_SERVICE_KEY }}
        run: python tools/_check_new.py
      - name: 결과 저장
        run: |
          git config user.name "tide-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_check.txt
          git commit -m "새 관측소 확인 결과" && git push
